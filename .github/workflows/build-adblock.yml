name: build-adblock

# 每周一 04:00 UTC（北京时间 12:00）重建合并去广告列表。
# 也可以到 Actions 页面手动触发。
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-adblock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build merged AdBlock list
        run: python3 script/build_adblock.py

      - name: Show diff summary
        run: |
          if [ -f rule/AdBlock.list ]; then
            echo "lines: $(wc -l < rule/AdBlock.list)"
            echo "bytes: $(wc -c < rule/AdBlock.list)"
          else
            echo "ERROR: rule/AdBlock.list not produced" >&2
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rule/AdBlock.list
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
          else
            git commit -m "chore(adblock): weekly rebuild $(date -u +%Y-%m-%d)"
            git push
          fi
