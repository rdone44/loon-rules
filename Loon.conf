# ⚠ 原配置的 CA（ca-p12 / ca-passphrase）已随文件外泄，不要再用。
#   用 Loon 自带证书：设置 → 中间人攻击 → 生成证书 → 安装 → 系统信任。
skip-server-cert-verify = false

# 多数 .lpx 自带 hostname 并由 Loon 自动合并，这里是兜底补充。
# g.cn / google.cn 供 Google.lpx 的跳转 Rewrite 使用（插件自带的首段可能不含 g.cn）。
# *.weixin.qq.com 服务于微信外部链接解锁插件。
# ⚠ 不要再把 *.taobao.com / *.tmall.com / *.jd.com / *.pinduoduo.com 加回来：
#   购物 App 走 MITM 解密会明显变卡，而且对应插件（淘宝/京东/拼多多去广告、京东比价）已全部关闭。
hostname = g.cn,*.g.cn,google.cn,*.google.cn,*.youtube.com,*.googlevideo.com,*.ytimg.com,*.spotify.com,*.scdn.co,*.doubleclick.net,*.googlesyndication.com,*.googleadservices.com,*.admob.com,*.umeng.com,*.cnzz.com,*.gdt.qq.com,*.amap.com,*.weixin.qq.com,*.soulapp.cn,*.555dy.com,*.weather.com,*.weatherkit.apple.com,*.weather-analytics-events.apple.com,*.configuration.apple.com,*.icloud.com
