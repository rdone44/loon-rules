# + Hijacking + Privacy，并入 yfamilys AntiAD，去重后由 GitHub Actions 每周重建。
# 仓库 https://github.com/rdone44/loon-rules  脚本 script/build_adblock.py
#
# ⚠ 规模：AntiAD 单表 32 万条，合并后约 32.4 万条 / 10.8MB。首次加载偏慢。
#   想提速就把 build_adblock.py 里 AntiAD 那行注释掉再重建，产物约 1000 条。
