哔哩哔哩 = select,DIRECT,香港自动,台湾自动,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png

# ---- 主策略组 ----
节点选择 = select,自动选择,DIRECT,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

# 直接对 4 个地区筛选器测速，不再套地区自动组（套娃会让测速链从 1 条变 7 条）
