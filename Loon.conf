DOMAIN-SUFFIX,msftncsi.com,DIRECT
DOMAIN-SUFFIX,captive.apple.com,DIRECT
DOMAIN-SUFFIX,network-test.debian.org,DIRECT
IP-CIDR,17.0.0.0/8,DIRECT,no-resolve

# ---- GeoIP 兜底（已禁用）----
# ⚠ 不要打开。国内 App 的广告 SDK（umeng / gdt / cnzz）多数解析到国内 IP，
#   打开后它们会在本行就被 DIRECT，永远走不到 [Remote Rule] 的广告表 ——
#   表现是「海外广告拦得住，国内广告一条都拦不住」。
#   中国域名直连由 China.list 覆盖，纯 IP 流量由 ChinaIPs.list 在订阅层兜底。
# GEOIP,CN,DIRECT

FINAL,漏网之鱼

