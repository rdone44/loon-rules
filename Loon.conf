[Rule]
# ============================================================================
# ⚠ 匹配顺序：本地 [Rule] > 插件规则 > [Remote Rule]
#
# 本地规则能命中的请求永远走不到远程规则。所以这里只放「必须直连 / 必须走
# 特定组」的例外，不要放 GEOIP 这类大网段兜底 —— 一放，下面的广告拦截表就
# 永远轮不到了（这正是 GEOIP,CN,DIRECT 被移除的原因，见段末）。
#
# 排查：远程规则似乎没生效时，先看日志命中了哪个 tag。
#   命中「漏网之鱼」→ 远程规则没加载
#   命中本地某条   → 被本地规则提前截走
# ============================================================================

