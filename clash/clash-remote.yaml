# Clash / Mihomo 配置：保留所选服务，远程规则按 Loon 策略顺序适配。
# 节点由网关注入，个人规则由网关插入 hidden 兼容组。

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - ntp.*.com
    - +.pool.ntp.org
    - +.rdone.eu.cc
    - +.workers.dev
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
proxies: []
proxy-groups:
  # ================= Loon [Proxy Group] 同序 =================
  # type: url-test = 自动测速选最快节点；include-all = 节点平铺到组内
  # ---- 应用策略组（全自动，节点平铺）----
  - name: Meta
    type: url-test
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Facebook.png
    include-all: true
    filter: '(?i)🇺🇸|美国|美國|洛杉矶|洛杉磯|纽约|紐約|圣何塞|聖何塞|圣克拉拉|西雅图|西雅圖|芝加哥|达拉斯|達拉斯|凤凰城|鳳凰城|硅谷|矽谷|United ?States|America|Los Angeles|San Jose|Santa Clara|Silicon Valley|Seattle|Chicago|Dallas|Phoenix|New York|Ashburn|Buffalo|Fremont|Las Vegas|美西|美东|美中|\b(US|USA|LAX|SJC|SFO|SEA|IAD|ORD|DFW|JFK|NYC|EWR|ATL|MIA|BOS|DEN|IAH|PHX|SAN|PDX|SLC|LAS|MSP|DTW|CLT|PHL)\d*\b'
