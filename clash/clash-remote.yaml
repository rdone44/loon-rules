# Clash / Mihomo 远程配置 —— 与 Loon.conf 同构（策略组 / 规则顺序一一对应）
# 节点由网关注入到 proxies，分组用 include-all 自动收录，无需 use: [remote]
# 规则集全部为 blackmatrix7 / 本仓库的 Loon 文本表，mihomo 用 classical + text 直接读，不需要转 mrs
# 个人规则（personal-ai / personal-direct）由网关插到 rules 顶部，指向两个 hidden 兼容组

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - ntp.*.com
    - +.pool.ntp.org
    - +.rdone.eu.cc
    - +.workers.dev
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
proxies: []
proxy-groups:
  # ================= Loon [Proxy Group] 同序 =================
  # type: url-test = 自动测速选最快节点；include-all = 节点平铺到组内（不嵌策略组）
