rules:
  # 本地例外已迁到远程表：源表 rules/exceptions.csv，由 Actions 生成 rules/generated/*.list。
  - RULE-SET,gen-appleid,AppleID
  - RULE-SET,gen-adblock,全球拦截
  - RULE-SET,gen-missav,MissAV
  - RULE-SET,gen-ai,AI
  - RULE-SET,yf-ADLite,全球拦截
  - RULE-SET,yf-AppleID,AppleID
  - RULE-SET,yf-ai-cn,DIRECT
  - RULE-SET,yf-Grok,Twitter
  - RULE-SET,yf-YouTube,YouTube
  - RULE-SET,yf-Spotify,Spotify
  - RULE-SET,yf-Telegram,Telegram
  - RULE-SET,yf-Twitter,Twitter
  - RULE-SET,yf-Facebook,Meta
  - RULE-SET,yf-Instagram,Meta
  - RULE-SET,yf-OKX,加密货币
  - RULE-SET,yf-Binance,加密货币
  - RULE-SET,yf-Cryptocurrency,加密货币
  - RULE-SET,yf-ai-global,AI
  - RULE-SET,yf-GitHub,GitHub
  - RULE-SET,yf-Microsoft,微软服务
  - RULE-SET,yf-Google,Google
  - RULE-SET,yf-AppleProxy,苹果服务
  - RULE-SET,yf-Apple,苹果服务
  - RULE-SET,yf-China-domain,DIRECT
  - RULE-SET,yf-ChinaIPs,DIRECT
  - MATCH,漏网之鱼

