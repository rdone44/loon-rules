  - RULE-SET,gen-adblock,全球拦截
  - RULE-SET,gen-missav,MissAV
  - RULE-SET,gen-ai,AI
  - RULE-SET,gen-crypto,加密货币
  - RULE-SET,gen-node-select,节点选择
  - RULE-SET,gen-personal,个人
  # 直连补充
  - RULE-SET,yf-AppleID,AppleID
  - RULE-SET,yf-AmazonCN,DIRECT
  # AI（必须早于 Google）
  - RULE-SET,yf-MetaAI,AI
  - RULE-SET,yf-OpenAI,AI
  - RULE-SET,yf-Gemini,Gemini
  - RULE-SET,yf-Claude,AI
  # 社交
  - RULE-SET,yf-Grok,Twitter
  - RULE-SET,yf-Twitter,Twitter
  - RULE-SET,yf-Instagram,Meta
  - RULE-SET,yf-Facebook,Meta
  - RULE-SET,yf-Threads,Meta
  - RULE-SET,yf-Whatsapp,Meta
  - RULE-SET,yf-Telegram,Telegram
  - RULE-SET,yf-Discord,Discord
  # 流媒体
  - RULE-SET,yf-YouTube,YouTube
  - RULE-SET,yf-YouTubeMusic,YouTube
  - RULE-SET,yf-Spotify,Spotify
  - RULE-SET,yf-BiliBiliIntl,节点选择
  # 金融
  - RULE-SET,yf-OKX,加密货币
  - RULE-SET,yf-Binance,加密货币
  - RULE-SET,yf-Bybit,加密货币
  - RULE-SET,yf-Cryptocurrency,加密货币
  - RULE-SET,yf-PayPal,PayPal
  - RULE-SET,yf-Cursor,Twitter
  # Google / Apple / 微软
  - RULE-SET,yf-GitHub,GitHub
  - RULE-SET,yf-Google,Google
  - RULE-SET,yf-Apple,苹果服务
  - RULE-SET,yf-Siri,苹果服务
  - RULE-SET,yf-TestFlight,苹果服务
  - RULE-SET,yf-Microsoft,微软服务
  # 通用
  - RULE-SET,yf-AndroidDownload,节点选择
  - RULE-SET,yf-Amazon,节点选择
  - RULE-SET,yf-Oracle,节点选择
  # 广告拦截放在服务表之后：先让 Spotify / YouTube 等精确表拿走正常 CDN 域名
  - RULE-SET,yf-AntiAD,全球拦截
  # 国内直连最后
  - RULE-SET,yf-China-domain,DIRECT
  - RULE-SET,yf-ChinaIPs,DIRECT
  # 策略组图标的图床：直连会被 TLS reset，固定走代理
  - DOMAIN-SUFFIX,cdn.jsdelivr.net,节点选择
  - MATCH,漏网之鱼

