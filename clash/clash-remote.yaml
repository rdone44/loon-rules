# Clash / Mihomo 远程配置：节点由 proxy-providers 拉取
# 示例节点使用 203.0.113.x（文档专用地址），不能直接连通，请替换成自己的订阅或节点。
# 规则集来自 MetaCubeX/meta-rules-dat，首次加载会下载 mrs 文件。
# 把 YOUR-PROFILE-ID 换成自己的远程订阅 id，或用 scripts/New-ClashRemoteProfile.ps1 生成
# 生成时间：2026-10-18T12:07:58.429Z

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - ntp.*.com
    - +.pool.ntp.org
    - +.rdone.eu.cc
    - +.workers.dev
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
proxies: []
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - DIRECT
    use:
      - remote
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    use:
      - remote
  - name: 🔯 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    use:
      - remote
  - name: 🔮 负载均衡
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    lazy: true
    use:
