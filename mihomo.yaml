  - { name: 美国节点, type: select, include-all: true, filter: '(?i)🇺🇸|美国|美國|洛杉矶|纽约|圣何塞|西雅图|芝加哥|达拉斯|凤凰城|硅谷|United ?States|America|\b(US|USA|LAX|SJC|SFO|SEA|IAD|ORD|DFW|JFK|NYC|EWR)\d*\b', exclude-filter: '(?i)回国|校园|游戏|到期|流量|剩余|官网|客服|订阅|邀请|频道' }
  - { name: 德国节点, type: select, include-all: true, filter: '(?i)🇩🇪|德国|德國|法兰克福|柏林|慕尼黑|汉堡|Germany|Frankfurt|\b(DE|DEU|FRA)\d*\b', exclude-filter: '(?i)回国|校园|游戏|到期|流量|剩余|官网|客服|订阅|邀请|频道' }
