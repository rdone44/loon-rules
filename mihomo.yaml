# mihomo (Clash.Meta) 配置 — 与 Loon.conf 同构（策略组 / 规则顺序一一对应）
# 使用：proxy-providers 里填订阅。Loon 插件 / MITM 脚本不迁移，本文件只覆盖分流与规则级去广告。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.direct'
    - cable.auth.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - network-test.debian.org
    - detectportal.firefox.com
    - resolver1.opendns.com
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - 'stun.*'
    - '*.stun.*'
    - localhost.ptlogin2.qq.com
    - '*.logon.battlenet.com.cn'
    - '*.logon.battle.net'
    - '*.blzstatic.cn'
    - '*.crashlytics.com'
    - '*.icloud.com'
    - '*.apple.com'
  default-nameserver: [223.5.5.5, 223.6.6.6]
  nameserver: ['https://doh.pub/dns-query', 'https://223.5.5.5/dns-query']
  proxy-server-nameserver: [223.5.5.5]

proxies: []

proxy-providers:
  订阅:
    type: http
    # 直接填机场订阅；更安全：填订阅网关的 /provider?token=… 地址，真订阅只存服务端
    url: 'https://你的订阅地址'
    interval: 86400
    health-check: { enable: true, url: 'http://www.gstatic.com/generate_204', interval: 600 }

rule-providers:
  MyDomains: { type: http, behavior: classical, format: text, interval: 86400, path: ./ruleset/MyDomains.list, url: 'https://raw.githubusercontent.com/rdone44/loon-rules/main/rule/MyDomains.list' }
