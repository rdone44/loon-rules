proxy-groups:
  # ---- 应用策略组 ----
  - { name: Meta, type: url-test, include-all: true, filter: '(?i)🇺🇸|美国|美國|洛杉矶|纽约|圣何塞|西雅图|芝加哥|达拉斯|凤凰城|硅谷|United ?States|America|\b(US|USA|LAX|SJC|SFO|SEA|IAD|ORD|DFW|JFK|NYC|EWR)\d*\b', exclude-filter: '(?i)回国|校园|游戏|到期|流量|剩余|官网|客服|订阅|邀请|频道', url: 'http://www.gstatic.com/generate_204', interval: 600, tolerance: 300 }
  - { name: YouTube, type: select, proxies: [香港自动, 台湾自动, 日本自动, 新加坡自动, 美国自动, 韩国自动, 德国自动] }
  - { name: Google, type: url-test, proxies: [香港自动, 台湾自动, 日本自动, 新加坡自动, 美国自动, 韩国自动, 德国自动], url: 'http://www.gstatic.com/generate_204', interval: 600, tolerance: 300 }
  - { name: Spotify, type: select, proxies: [香港自动, 台湾自动, 日本自动, 新加坡自动, 美国自动] }
  - { name: AI, type: select, proxies: [美国节点, 日本节点, 新加坡节点, 其他节点] }
  - { name: 苹果服务, type: select, proxies: [DIRECT, 香港自动, 美国自动] }
  - { name: 微软服务, type: select, proxies: [DIRECT, 德国自动, 美国自动] }
  - { name: GitHub, type: url-test, proxies: [香港自动, 台湾自动, 日本自动, 新加坡自动, 美国自动, 韩国自动, 德国自动], url: 'http://www.gstatic.com/generate_204', interval: 600, tolerance: 300 }
  - { name: Telegram, type: select, proxies: [香港节点, 日本节点, 新加坡节点, 美国节点, 其他节点] }
  - { name: LINE, type: select, proxies: [日本自动, 日本节点, 台湾自动, 新加坡自动, 自动选择] }
  - { name: Twitter, type: select, proxies: [美国自动, 美国节点, 自动选择] }
  - { name: 游戏平台, type: select, proxies: [DIRECT, 香港自动, 日本自动, 美国自动] }
  - { name: 加密货币, type: select, proxies: [日本自动] }
  - { name: 金融应用, type: select, proxies: [DIRECT] }
  - { name: 国外媒体, type: select, proxies: [香港自动, 台湾自动, 日本自动, 新加坡自动, 美国自动] }
  - { name: MissAV, type: select, proxies: [日本自动, 香港自动, 台湾自动, 美国自动, 其他节点] }
  - { name: 哔哩哔哩, type: select, proxies: [DIRECT, 香港自动, 台湾自动] }
  # ---- 主策略组 ----
  - { name: 节点选择, type: select, proxies: [自动选择, DIRECT] }
  - { name: 自动选择, type: url-test, include-all: true, filter: '(?i)🇭🇰|香港|🇯🇵|日本|🇸🇬|新加坡|🇺🇸|美国|Hong ?Kong|Tokyo|Osaka|Singapore|\b(HK|HKG|JP|JPN|SG|SGP|US|USA)\b', exclude-filter: '(?i)回国|校园|游戏|到期|流量|剩余|官网|客服|订阅|邀请|频道', url: 'http://www.gstatic.com/generate_204', interval: 600, tolerance: 150 }
  # ---- 功能策略组 ----
  - { name: 全球拦截, type: select, proxies: [REJECT, DIRECT] }
  - { name: 漏网之鱼, type: fallback, proxies: [香港自动, 日本自动, 美国自动, 新加坡自动, 其他节点], url: 'http://www.gstatic.com/generate_204', interval: 300 }
  # ---- 地区节点（筛选器）----
  - { name: 香港节点, type: select, include-all: true, filter: '(?i)🇭🇰|香港|港|Hong ?Kong|\b(HK|HKG|HKT|HKBN|PCCW|HKIX|WTT|CMI|HGC)\d*\b', exclude-filter: '(?i)回国|校园|游戏|到期|流量|剩余|官网|客服|订阅|邀请|频道' }
  - { name: 台湾节点, type: select, include-all: true, filter: '(?i)🇹🇼|台湾|臺灣|台北|新北|台中|台南|高雄|新竹|Taiwan|Taipei|\b(TW|TWN|TPE)\d*\b|HiNet', exclude-filter: '(?i)回国|校园|游戏|到期|流量|剩余|官网|客服|订阅|邀请|频道' }
  - { name: 日本节点, type: select, include-all: true, filter: '(?i)🇯🇵|日本|东京|東京|大阪|京都|名古屋|札幌|横滨|埼玉|Japan|Tokyo|Osaka|NTT|\b(JP|JPN|NRT|HND|KIX|TYO)\d*\b', exclude-filter: '(?i)回国|校园|游戏|到期|流量|剩余|官网|客服|订阅|邀请|频道' }
