# mihomo (Clash.Meta) 配置 —— 已弃用，不要再改这份
# Clash / mihomo 侧请用 clash/clash-remote.yaml：那份才跟 Loon.conf 逐表同序，
# 并且会随仓库同步 FinanceCN / AdsExtra / WeChat / Carrier / priority 等新增规则集。
# 本文件仅作历史对照保留（原本是 Loon.conf 的同构克隆，已不再更新）。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.direct'
    - cable.auth.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - network-test.debian.org
    - detectportal.firefox.com
    - resolver1.opendns.com
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - 'stun.*'
    - '*.stun.*'
    - localhost.ptlogin2.qq.com
    - '*.logon.battlenet.com.cn'
    - '*.logon.battle.net'
    - '*.blzstatic.cn'
    - '*.crashlytics.com'
    - '*.icloud.com'
    - '*.apple.com'
  default-nameserver: [223.5.5.5, 223.6.6.6]
  nameserver: ['https://doh.pub/dns-query', 'https://223.5.5.5/dns-query']
  proxy-server-nameserver: [223.5.5.5]

proxies: []

proxy-providers:
  订阅:
    type: http
    # 直接填机场订阅；更安全：填订阅网关的 /provider?token=… 地址，真订阅只存服务端
    url: 'https://你的订阅地址'
    interval: 86400
    health-check: { enable: true, url: 'http://www.gstatic.com/generate_204', interval: 600 }

rule-providers:
  MyDomains: { type: http, behavior: classical, format: text, interval: 86400, path: ./ruleset/MyDomains.list, url: 'https://cdn.jsdelivr.net/gh/rdone44/loon-rules@main/rule/MyDomains.list' }
